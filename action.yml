name: ossready
description: Score how ready a repository is for open source, with a fix for every gap, in the job summary.
author: Adarsh
branding:
  icon: check-circle
  color: green

inputs:
  path:
    description: Directory to check.
    required: false
    default: "."
  fail-under:
    description: Fail the job when the score is below this value (0-100). Defaults to the config file, else 0.
    required: false
    default: ""
  ignore:
    description: Comma-separated check IDs to skip, in addition to those in .ossready.toml.
    required: false
    default: ""
  python-version:
    description: Python version used to run ossready.
    required: false
    default: "3.13"

outputs:
  score:
    description: The score from 0 to 100.
    value: ${{ steps.run.outputs.score }}
  grade:
    description: The letter grade (A to F).
    value: ${{ steps.run.outputs.grade }}
  badge:
    description: Markdown for a shields.io badge showing the score.
    value: ${{ steps.run.outputs.badge }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ossready
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH"

    - name: Run ossready
      id: run
      shell: bash
      env:
        OSSREADY_PATH: ${{ inputs.path }}
        OSSREADY_FAIL_UNDER: ${{ inputs.fail-under }}
        OSSREADY_IGNORE: ${{ inputs.ignore }}
      run: |
        args=("$OSSREADY_PATH" --ignore "$OSSREADY_IGNORE")
        ossready check "${args[@]}" --format markdown >> "$GITHUB_STEP_SUMMARY"
        ossready check "${args[@]}" --format json > "$RUNNER_TEMP/ossready.json"
        python - <<'EOF' >> "$GITHUB_OUTPUT"
        import json, os
        report = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "ossready.json")))
        print(f"score={report['score']}")
        print(f"grade={report['grade']}")
        EOF
        echo "badge=$(ossready check "${args[@]}" --format badge)" >> "$GITHUB_OUTPUT"
        if [ -n "$OSSREADY_FAIL_UNDER" ]; then
          args+=(--fail-under "$OSSREADY_FAIL_UNDER")
        fi
        FORCE_COLOR=1 ossready check "${args[@]}"
