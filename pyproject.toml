[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ossready"
dynamic = ["version"]
description = "Score how ready a repository is for open source, and create the files it's missing."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adarsh" }]
keywords = [
    "open source",
    "maintainers",
    "community health",
    "repository",
    "linter",
    "scaffolding",
    "github actions",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
# No dependencies on Python 3.11+. Older versions need tomli to read .ossready.toml.
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "pyyaml>=6"]

[project.scripts]
ossready = "ossready.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/ossready"
Issues = "https://github.com/OWNER/ossready/issues"
Changelog = "https://github.com/OWNER/ossready/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "ossready.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ossready = ["licenses/*.txt", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
